{% extends 'core/base.html' %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-form" style="text-align: center;">
        <h2>✅ Email Sent!</h2>
        <p>We've emailed you instructions for resetting your password.</p>
        <p>If you don't receive an email within a few minutes, check your spam folder.</p>
        <br>
        <a href="{% url 'login' %}" class="auth-btn" style="text-decoration: none; display: inline-block;">Back to Login</a>
    </div>
</div>
{% endblock %}
